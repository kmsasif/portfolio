<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0e1329"/>
      <stop offset="100%" stop-color="#061c2b"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="safe-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="danger-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.12" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Glow Accents -->
  <circle cx="200" cy="180" r="140" fill="#00f2fe" opacity="0.08" filter="url(#glow)"/>
  <circle cx="620" cy="240" r="160" fill="#9d4edd" opacity="0.08" filter="url(#glow)"/>

  <!-- Left: Security Shield & Scanner -->
  <g transform="translate(100, 95)">
    <!-- Shield Outer -->
    <path d="M 120 10 L 210 50 C 210 160, 150 220, 120 250 C 90 220, 30 160, 30 50 Z" 
          fill="url(#shield-grad)" stroke="#00f2fe" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Lock / Radar Icon inside shield -->
    <path d="M 100 110 L 100 90 C 100 78, 140 78, 140 90 L 140 110" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
    <rect x="90" y="110" width="60" height="48" rx="8" fill="#0a192f" stroke="#00f2fe" stroke-width="3"/>
    <circle cx="120" cy="130" r="6" fill="#00f2fe"/>
    <line x1="120" y1="136" x2="120" y2="146" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>

    <!-- Pulse radar rings -->
    <circle cx="120" cy="130" r="55" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
    <circle cx="120" cy="130" r="85" fill="none" stroke="#9d4edd" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  </g>

  <!-- Right: Mockup Dashboard Terminal -->
  <g transform="translate(370, 70)">
    <!-- Terminal Window Container -->
    <rect x="0" y="0" width="370" height="290" rx="14" fill="#090d1a" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <rect x="0" y="0" width="370" height="40" rx="14" fill="#12182b"/>
    <rect x="0" y="26" width="370" height="14" fill="#12182b"/>
    
    <!-- Window Controls -->
    <circle cx="24" cy="20" r="6" fill="#ef4444"/>
    <circle cx="44" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="20" r="6" fill="#10b981"/>
    <text x="185" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">ML URL Classifier v2.4</text>

    <!-- URL Input Bar Simulation -->
    <rect x="20" y="55" width="330" height="38" rx="8" fill="#151d33" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="35" y="78" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">https://secure-login.bank-verify.xyz/auth</text>

    <!-- Detection Result Card 1: Alert -->
    <rect x="20" y="106" width="330" height="52" rx="8" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="42" cy="132" r="12" fill="#ef4444"/>
    <text x="42" y="137" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">!</text>
    <text x="65" y="127" fill="#fca5a5" font-family="'Outfit', sans-serif" font-weight="bold" font-size="13">Malicious URL Detected (Phishing)</text>
    <text x="65" y="145" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Confidence Score: 98.4% | Lexical Anomaly</text>

    <!-- Detection Result Card 2: Safe URL -->
    <rect x="20" y="170" width="330" height="48" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="42" cy="194" r="10" fill="#10b981"/>
    <text x="42" y="198" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
    <text x="65" y="189" fill="#6ee7b7" font-family="'Outfit', sans-serif" font-weight="bold" font-size="12">https://github.com/kmsasif</text>
    <text x="65" y="206" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Status: Legitimate | Risk Index: 0.02</text>

    <!-- Metrics Bar Footer -->
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="98" height="38" rx="6" fill="#131c31"/>
      <text x="49" y="16" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">SCANNED</text>
      <text x="49" y="32" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">12,480</text>

      <rect x="110" y="0" width="105" height="38" rx="6" fill="#131c31"/>
      <text x="162" y="16" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">ACCURACY</text>
      <text x="162" y="32" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">97.8%</text>

      <rect x="226" y="0" width="104" height="38" rx="6" fill="#131c31"/>
      <text x="278" y="16" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">DATABASE</text>
      <text x="278" y="32" fill="#9d4edd" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">MongoDB</text>
    </g>
  </g>

  <!-- Title Badge Bottom Left -->
  <g transform="translate(60, 385)">
    <rect x="0" y="0" width="310" height="36" rx="18" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#00f2fe"/>
    <text x="35" y="23" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="600" font-size="13">AI-Based Phishing URL Detection</text>
  </g>
</svg>
